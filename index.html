        <p style="font-size: 1.2rem; font-weight: 600; color: #0284c7; margin: 0 0 0.5rem 0;">
          Business Operations &amp; Strategic Management Specialist | Certified HR Specialist (MarkPlus Institute, Nilai 93,00) | Six Sigma White Belt (CSSC, USA) | Founder &amp; Creator Ekosistem &ldquo;Maha Karya&rdquo;
        </p>

        </p>

      <main style="max-width: 900px; margin: 0 auto 2rem; padding: 0 1.5rem; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; color: #334155; line-height: 1.6;">
        
        <!-- Ringkasan Eksekutif & Karir -->
        <section style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.35rem; font-weight: 700; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.4rem; margin-bottom: 0.75rem;">
            Profil Profesional &amp; Ringkasan Karir
          </h2>
          <p>
            Alvareza Hilka Pratama adalah seorang Management Professional, Certified Human Resources Specialist (MarkPlus Institute &ndash; Skor Akhir 93,00, Grade A / Outstanding), dan Six Sigma White Belt (The Council for Six Sigma Certification &ndash; CSSC, USA) lulusan Sarjana Manajemen (S1 Manajemen, S.M.) Universitas Al-Ghifari.
          </p>
          <p>
            Berpengalaman luas dalam memimpin efisiensi bisnis, otomatisasi sistem operasional, dan supervisi lintas divisi. Memiliki rekam jejak terbukti memimpin operasional 13 gerai ritel (8 Cabang Toko Jaya Baru + 5 Cabang Multi Sejahtera), merancang dan menstandarisasi 20+ SOP operasional yang memangkas hambatan kerja hingga 70%, serta mengoordinasikan lebih dari 100 proyek komersial dengan tingkat kepuasan mitra 98% CSAT dan kepatuhan SLA 95%.
          </p>
        </section>

        <!-- Portofolio Unggulan: Maha Karya Solusi Digital & Web App -->
        <section style="margin-bottom: 2rem;">
          <h2 style="font-size: 1.35rem; font-weight: 700; color: #0f172a; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.4rem; margin-bottom: 0.75rem;">
            Maha Karya &mdash; Solusi Digital &amp; Aplikasi Web yang Didirikan &amp; Diciptakan oleh Alvareza Hilka Pratama
          </h2>
          <p>
            Alvareza Hilka Pratama adalah pendiri, arsitek sistem, dan pencipta (*founder &amp; creator*) 8 platform digital unggulan dalam portofolio &ldquo;Maha Karya&rdquo; serta lebih dari 50 aplikasi web kustom dan sistem ERP korporasi:
          </p>
          <ol style="padding-left: 1.25rem;">
            <li style="margin-bottom: 0.8rem;">
              <strong>HR MATRIX (HRMATRIKS) &ndash; Integrated HRIS &amp; General Affair (GA) Platform:</strong><br />
              Sistem informasi SDM dan GA terpadu berbasis web yang mencakup database karyawan, absensi digital GPS &amp; kamera multi-shift, kalkulasi payroll otomatis sesuai tarif efektif rata-rata (PPh 21 TER PP 58/2023) &amp; 5 program BPJS Ketenagakerjaan/Kesehatan, penilaian KPI, generator kontrak PKWT/PKWTT legal, manajemen aset GA, dan portal integrasi resmi instansi ketenagakerjaan.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>MY TALENTY &ndash; People Development &amp; Candidate Assessment Platform:</strong><br />
              Platform asesmen talenta dan rekrutmen komprehensif yang dilengkapi &ldquo;Gudang Test&rdquo; psikometri berstandar profesional, teknologi &ldquo;SmartForm&rdquo; dengan deteksi anti-contek otomatis (tab-switch tracking &amp; duration monitor), serta sistem akuisisi kandidat yang terhubung langsung ke database onboarding HR.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>KARIR KITA &ndash; Career Hub &amp; Job Placement Portal:</strong><br />
              Platform karir interaktif dan ekosistem pencarian kerja untuk menghubungkan talenta terverifikasi dengan berbagai peluang kerja di industri.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>MITRA GATEWAY &ndash; Enterprise Resource Planning (ERP) Platform:</strong><br />
              Ekosistem ERP korporasi multi-modul terintegrasi yang menyatukan Marketing, Finance &amp; Accounting, HRGA, Operasional, hingga Executive BI Dashboard untuk pemilik usaha / C-Level secara real-time.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>VYNANCE &ndash; Corporate Accounting, Finance &amp; Transaction Ledger:</strong><br />
              Platform pembukuan keuangan modular skala korporasi yang mengelola arus kas harian, buku besar keuangan, otomatisasi jurnal, inventarisasi dan depresiasi aset bisnis, hingga penyusunan neraca laba-rugi terintegrasi.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>NEXT MARKETING &ndash; B2B CRM &amp; Multi-Channel Marketing Automation:</strong><br />
              Platform manajemen pipeline prospek B2B, follow-up otomatis prospek potensial, serta analitik performa iklan digital dengan metrik evaluasi ROAS dan closing rate.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>LOGISTOR &ndash; Supply Chain, Inventory &amp; Warehouse Operations ERP:</strong><br />
              Sistem manajemen rantai pasok dan pergudangan: pelacakan bahan baku masuk/keluar, kalkulasi otomatis Harga Pokok Penjualan (HPP FIFO, LIFO, Average), monitoring utang-piutang supplier, penjadwalan produksi, dan distribusi pesanan.
            </li>
            <li style="margin-bottom: 0.8rem;">
              <strong>MY DIBY &ndash; B2B Corporate Intelligence &amp; Market Directory:</strong><br />
              Basis data intelijen pasar korporat mencakup pemetaan 4.000+ data perusahaan, 5.200+ kontak keputusan kunci (PIC HRGA, Purchasing, General Manager), serta pemetaan koordinat zonasi kawasan industri strategis.
            </li>
